function runJava(src){const head="$ mvn test\n",ce=m=>({n:0,bad:1,text:head+"[ERROR] COMPILATION ERROR\n[ERROR] "+m+"\nBUILD FAILURE"});
let P;try{P=jparse(src)}catch(e){return ce(e.message)}
const fields=[],before=[],tests=[];
for(const x of P.items){if(x.field){const f=/(\w+)\s*(?:=\s*([\s\S]+))?$/.exec(x.h.replace(/@\w+/g,"").trim());if(f)fields.push([f[1],f[2]||"null"])}
else if(/@Test\b/.test(x.h)){const n=/(\w+)\s*\(\s*\)\s*$/.exec(x.h);if(!n)return ce("error: @Test methods must take no parameters");tests.push([n[1],x.body,/@Disabled/.test(x.h)])}
else if(/@BeforeEach\b/.test(x.h))before.push(["setup",x.body])}
const mk=(nm,body)=>{const s=semi(body);if(s)throw new Error("error: ';' expected\n[ERROR]   in "+nm+"(): "+s.trim());try{return new Function("F","Calculator","MathService","JEx","with(F){"+tj(body)+"\n}")}catch(e){throw new Error("error: illegal start of expression ("+e.message+")\n[ERROR]   in "+nm+"()")}};
let T,B,FI;try{T=tests.map(t=>({n:t[0],f:mk(t[0],t[1]),skip:t[2]}));B=before.map(b=>mk(b[0],b[1]));FI=fields.map(f=>mk(f[0],f[0]+" = "+f[1]+";"))}catch(e){return ce(e.message)}
const log=["[INFO] Running "+P.name];let ok=0,fl=0,er=0,sk=0;
for(const t of T){if(t.skip){sk++;log.push("[WARNING]   ⊘ "+t.n+" (disabled)");continue}
const F=Object.create(JA);fields.forEach(f=>F[f[0]]=null);
try{[...FI,...B,t.f].forEach(f=>f(F,Calculator,MathService,JEx));ok++;log.push("[INFO]    ✓ "+t.n)}
catch(e){if(e.af){fl++;log.push("[ERROR]   ✗ "+t.n+"\n            AssertionFailedError: "+e.message)}
else if(e instanceof ReferenceError||/is not a function|is not a constructor/.test(e.message)){const s=/(\w+) is not (?:a function|a constructor|defined)/.exec(e.message);return ce("error: cannot find symbol\n[ERROR]   symbol: "+(e instanceof ReferenceError?"variable ":"method/class ")+(s?s[1]:"?")+"\n[ERROR]   in "+t.n+"()")}
else{er++;log.push("[ERROR]   ✗ "+t.n+"\n            "+(e.jn||e.name)+": "+e.message)}}}
const n=ok+fl+er,bad=fl+er;if(!T.length)log.push("[WARNING] No tests found. Did you add @Test?");
log.push("Tests run: "+n+", Failures: "+fl+", Errors: "+er+", Skipped: "+sk,bad?"BUILD FAILURE":"BUILD SUCCESS");return{n,bad,text:head+log.join("\n")}}

/* ---------- EXERCISE: editable, really executed, state kept while navigating ---------- */
function exercise(ex,id,L){const w=el("div"),k=L+id,py=L==="py";
w.append(el("p","","Write your test and press <b>Run</b> (or <kbd>Ctrl</kbd>+<kbd>Enter</kbd>). Your code is "+(py?"executed by real Python (Pyodide, downloaded on first run).":"executed by a built-in JUnit 5 runner (a subset of Java; use <code>mvn test</code> locally for the real thing).")));
const det=el("details","fl");det.append(el("summary","","📂 Project files you can use (Calculator, MathService)"),code(D[L].calc),code(D[L].svc));
const ta=el("textarea");ta.value=EX[k]??ex.starter;ta.spellcheck=false;const out=el("div");
ta.oninput=()=>EX[k]=ta.value;
const c=el("button","btn","▶ Run tests"),h=el("button","btn ghost","💡 Show solution"),r=el("button","btn ghost","↺ Reset");
ta.onkeydown=e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ta.setRangeText("    ",ta.selectionStart,ta.selectionEnd,"end");EX[k]=ta.value}else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();c.click()}};
c.onclick=async()=>{const v=ta.value;c.disabled=true;out.className="out";out.textContent=py&&!pyReady?"⏳ Loading Python runtime (about 10 MB, first run only)…":"⏳ Running…";
const plain=v.replace(py?/#.*$/gm:/\/\*[\s\S]*?\*\/|\/\/.*$/gm,"");const miss=ex.chk.filter(x=>!x[0].test(plain));
let res,fb=false;try{res=py?await runPy(v):runJava(v)}catch(e){fb=true;res={n:1,bad:0,text:"⚠ Could not load the Python runtime (offline?). Falling back to a structure check only. Your code was NOT executed."}}
const ok=res.n>0&&!res.bad&&!miss.length;
const verdict=ok?"✔ Exercise complete!":res.bad?"✖ Fix the failing tests or errors above, then run again.":!res.n?"✖ No tests ran. Add a test method inside the class.":"✖ Tests pass, but the exercise still asks you to:\n• "+miss.map(m=>m[1]).join("\n• ");
out.className="out "+(ok?"ok":"bad");out.textContent=res.text+"\n\n"+verdict;if(ok)mark(id);c.disabled=false};
h.onclick=()=>{out.className="out ok";out.textContent="Solution (add inside the class):\n\n"+ex.sol};
r.onclick=()=>{ta.value=ex.starter;EX[k]=ta.value;out.className="";out.textContent=""};
w.append(det,ta,c,h,r,out);return w}

function draw(){
document.querySelectorAll("#pick button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
const c=el("div","card");
if(!lang){c.innerHTML="<h2>👋 Welcome</h2><p>Choose <b>Python</b> or <b>Java</b> above to begin. You’ll set up locally, write unit tests, then integration tests, with exercises and quizzes along the way.</p>";$("#stage").replaceChildren(c);$("#dots").replaceChildren();$("#pb").style.width="0";$("#pl").textContent="";$("#ps").textContent="";return}
c.append(steps[cur].r(lang));$("#stage").replaceChildren(c);
$("#pb").style.width=Math.round((cur+1)/steps.length*100)+"%";
$("#pl").textContent=D[lang].name+" track · "+steps[cur].t;$("#ps").textContent="Step "+(cur+1)+" of "+steps.length;
dots();
$("#prev").disabled=cur===0;$("#next").disabled=cur===steps.length-1}
document.querySelectorAll("#pick button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;cur=0;done=new Set();for(const k in QS)delete QS[k];try{localStorage.setItem("tt_lang",lang)}catch(e){}draw()});
$("#prev").onclick=()=>{if(cur>0){cur--;draw();scrollTo(0,0)}};
$("#next").onclick=()=>{if(cur<steps.length-1){cur++;draw();scrollTo(0,0)}};
draw();
